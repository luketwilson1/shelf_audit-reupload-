name: Tests
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.5.2 Pillow==12.3.0 opencv-python-headless==5.0.0.93 imageio-ffmpeg==0.6.0
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Sample replay
        run: python -m shelf_audit.track_video examples/predictions.json --out outputs/ci_sample --reconnect
